server {
        listen 80;
        server_name indexer.gmoon.xyz;
        return 301 https://$host$request_uri;
}

server {
        listen 443 ssl;
        server_name indexer.gmoon.xyz;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        ssl_certificate /etc/nginx/ssl/indexer.crt;
        ssl_certificate_key /etc/nginx/ssl/indexer.key;

        location / {
                proxy_set_header    Host            $host;
                proxy_set_header    X-Real-IP       $remote_addr;
                proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header    X-Forwarded-Proto $scheme;

                client_body_buffer_size 64k;
                proxy_cache_methods     GET HEAD POST;
				proxy_cache             indexer_cache;
                proxy_cache_key         "$scheme$request_method$host$request_uri$request_body";
                proxy_cache_valid       200 5s;
                proxy_cache_valid       any 0; 

                proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
                proxy_cache_background_update on;
                proxy_cache_lock       on;       
                proxy_cache_lock_timeout 5s;

                proxy_ignore_headers   Set-Cookie;
                proxy_no_cache         $http_authorization;
                proxy_cache_bypass     $http_authorization;

                add_header X-Cache-Status $upstream_cache_status;

                proxy_pass http://0.0.0.0:3001;
        }
}
