services:
  rindexer:
    image: 193.124.67.84:8090/repository/ktm-docker/rindexer:1.0.0
    container_name: rindexer
    restart: always
    ports:
      - 3001:3001/tcp
      - 8080:8080/tcp
    networks:
      - default
    environment:
      - PROJECT_PATH=/app/
      - DATABASE_URL=postgresql://postgres:ALtO7sltoOS1UDFP@postgres:5432/postgres
    depends_on: 
     - postgres
    volumes:
      - ./abis:/app/project/abis:ro
      - ./rindexer.yaml:/app/rindexer.yaml
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ALtO7sltoOS1UDFP
      POSTGRES_DB: postgres
    ports:
      - 0.0.0.0:5432:5432/tcp
    volumes:
      - pgdata2:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
networks:
  default:
    name: rindexer_default

volumes:
  pgdata2:
