name: franky
project_type: no-code
networks:
  - name: robinhood
    chain_id: 1488
    rpc: https://rpc-testnet.gmoon.xyz
    block_poll_frequency: 1000
    max_block_range: 10
graphql:
  port: 3001
storage:
  postgres:
    enabled: true
contracts:
  - name: GemoonUniswapHook
    abi: ./abis/IHookManager.json
    include_events:
      - MemeSwapped
      - FeeCharged
      - FeesDistributed
    details:
      - network: robinhood
        start_block: 84313643
        address: 0xB5e8dB4dB0Aa808d6843fA85D0935B92B0a870cc
  - name: UniswapV3SwapAdapter
    abi: ./abis/IUniswapV3SwapAdapter.json
    include_events:
      - Swapped
    details:
      - network: robinhood
        start_block: 84313643
        address: 0xF2FD42cF7De669D99bdd18fd98755Bfe35b5638f
  - name: GemoonVault
    abi: ./abis/IVault.json
    include_events:
      - VaultRegistered
      - FeesNotified
      - FeesConverted
      - ConversionFailed
      - Staked
      - Unstaked
      - RewardPaid
      - CreatorRewardPaid
      - CreatorTransferred
    details:
      - network: robinhood
        start_block: 84313643
        address: 0xBEe2253Ef8B47FC9c54D32ec9560cec962B79573
  - name: UniswapPoolManager
    abi: ./abis/IPoolManager.json
    include_events:
      - Swap
    details:
      - network: robinhood
        start_block: 84313643
        address: 0x8366a39CC670B4001A1121B8F6A443A643e40951
  - name: GemoonController
    abi: ./abis/IGemoonController.json
    include_events:
      - TokenCreated
      - PoolCreated
      - PositionCreated
    details:
      - network: robinhood
        start_block: 84313643
        address: 0xEd81B09c9EB3af64CE573ece2fe74e272f9ba586
  - name: GemoonToken
    abi: ./abis/IGemoonToken.json
    include_events:
      - Transfer
      - Approval
      - UpdateImage
      - UpdateDescription
    details:
      - network: robinhood
        start_block: 84313643
        factory:
          name: GemoonController
          address: 0xEd81B09c9EB3af64CE573ece2fe74e272f9ba586
          abi: ./abis/IGemoonController.json
          event_name: TokenCreated
          input_name: "tokenAddress"
